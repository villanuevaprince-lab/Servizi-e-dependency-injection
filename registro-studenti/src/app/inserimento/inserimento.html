<h2>Nuovo studente</h2><form #modulo="ngForm" (ngSubmit)="salva()" class="p-4 bg-body-tertiary rounded-3"><label class="form-label">Nome e cognome</label><input name="nome" class="form-control mb-3" [(ngModel)]="nome" required><label class="form-label">Classe</label><input name="classe" class="form-control mb-3" [(ngModel)]="classe" required><label class="form-label">Media dei voti</label><input name="media" type="number" class="form-control mb-3" [(ngModel)]="media" required min="1" max="10" step="0.1"><button class="btn btn-primary" [disabled]="modulo.invalid">Salva</button></form>
