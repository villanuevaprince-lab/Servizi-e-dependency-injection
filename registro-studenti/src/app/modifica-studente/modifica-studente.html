<h2>Modifica studente</h2><form #modulo="ngForm" (ngSubmit)="salva()" class="p-4 bg-body-tertiary rounded-3"><input name="nome" class="form-control mb-3" [(ngModel)]="nome" required><input name="classe" class="form-control mb-3" [(ngModel)]="classe" required><input name="media" type="number" class="form-control mb-3" [(ngModel)]="media" required min="1" max="10" step="0.1"><button class="btn btn-primary" [disabled]="modulo.invalid">Salva modifiche</button></form>
