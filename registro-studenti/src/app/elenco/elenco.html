<h2>Elenco degli studenti</h2><div class="row g-2 mb-3"><div class="col-auto"><input class="form-control" [(ngModel)]="filtroClasse" placeholder="Filtra per classe, es. 4B"></div><div class="col-auto"><button class="btn btn-outline-primary me-1" (click)="ordine.set('nome')">Per nome</button><button class="btn btn-outline-primary" (click)="ordine.set('media')">Per media</button></div></div>@if(visibili().length===0){<div class="alert alert-warning">Nessuno studente trovato.</div>}@else{<table class="table table-striped table-hover"><thead><tr><th>Id</th><th>Nome</th><th>Classe</th><th>Media</th><th></th></tr></thead><tbody>@for(s of visibili();track s.id){<tr><td>{{s.id}}</td><td>{{s.nome}}</td><td>{{s.classe}}</td><td [class.text-success]="s.mediaVoti>=6" [class.text-danger]="s.mediaVoti<6">{{s.mediaVoti}}</td><td class="text-end"><a class="btn btn-sm btn-outline-primary" [routerLink]="['/elenco',s.id]">Dettaglio</a><a class="btn btn-sm btn-outline-secondary ms-1" [routerLink]="['/modifica',s.id]">Modifica</a><button class="btn btn-sm btn-outline-danger ms-1" (click)="rimuovi(s.id)">Elimina</button></td></tr>}</tbody></table><p>Media della classe: <strong>{{mediaClasse().toFixed(2)}}</strong></p>}
