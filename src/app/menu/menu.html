<h2>Menu</h2><ul class="list-group">@for (p of piatti; track p.id) {<li class="list-group-item d-flex justify-content-between align-items-center"><span>{{p.nome}} <small>{{p.prezzo.toFixed(2)}} €</small> @if (quantitaDi(p)>0) {<span class="badge text-bg-success">{{quantitaDi(p)}} nell'ordine</span>}</span><button class="btn btn-sm btn-primary" (click)="aggiungi(p)">Aggiungi</button></li>}</ul>
